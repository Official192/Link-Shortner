<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortner for website</title>
    <meta name="description" content="Shorten Your Website">
    <link rel="icon" type="image/x-icon" href="Favicon.ico?v=2">
   <script src="https://cdn.tailwindcss.com"></script>
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 flex items-center px-4 justify-center min-h-screen w-full">


<main class="bg-white flex flex-col justify-center p-4 w-full rounded-xl shadow-lg max-w-[350px]">

   <div class="flex justify-center">
      <img src="Favicon.ico" width="30" alt="Favicon">
   </div>

   <section class="flex flex-col mx-10">
      <input type="url" id="link" class="rounded max-w-[100%] mt-6" placeholder="Paste your link here">
      <input type="text" id="generate" class="rounded max-w-[100%] mt-5" readonly aria-label="generative-link">
 </section>  

 <div class="flex justify-center">
   <button onclick="change()" class="text-white bg-red-600 hover:bg-red-800 w-36 rounded p-1 mt-5">Generate Link</button>   
</div>
 
</main>


<script src="script.js"></script>
</body>
</html>
