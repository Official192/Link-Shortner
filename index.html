<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortner for website</title>
    <link rel="icon" type="image/x-icon" href="Favicon.ico?v=2">
   <script src="https://cdn.tailwindcss.com"></script>
   <style>

      input{
        border: solid 1px gray;
      }

      input:focus{
         border: 1px red solid !important;
         outline: none;
      }


   </style>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen w-full">


<main class="bg-white flex flex-col justify-start p-4 w-full rounded-xl shadow-lg max-w-[350px]">
   <img src="Favicon.ico" width="30" alt=""style="margin-left: 145px;" srcset="">
   <section class="flex flex-col mx-10">
      <input type="url" id="link" class="w-full rounded max-w-[100%] mt-6 p-1" placeholder="Paste your link here">
       <input type="text" id="generate" class="w-full rounded max-w-[120%] mt-5 p-1" readonly aria-label="generative-link">
 </section>  

  <button onclick="change()" class="text-white bg-red-700 p-1 rounded w-36 mx-[26%] mt-5">Generate Link</button>
</main>



<script src="script.js"></script>
</body>
</html>
