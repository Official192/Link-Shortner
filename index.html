<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortner for website</title>
    <link rel="icon" type="image/x-icon" href="Favicon.ico?v=2">
   <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-300 flex items-center justify-center min-h-screen w-full">


<main class="bg-white flex flex-col justify-start p-4 w-full rounded-lg max-w-[350px]">
   <section class="flex flex-col mx-10">
      <input type="url" id="link" class="w-full rounded max-w-[100%] bg-gray-200 mt-10 p-1" placeholder="Paste your link here">
       <input type="text" id="generate" class="w-full rounded max-w-[120%] bg-gray-200 mt-5 p-1" readonly>
 </section>  

  <button onclick="change()" class="text-white bg-red-700 p-1 rounded w-36 mx-[26%] mt-5">Generate Link</button>
</main>


</body>

<script src="script.js"></script>
</body>
</html>
